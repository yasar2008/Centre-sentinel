name: Kaushal-Drishti CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Edge Agent Verification: Linting, Accuracy Tests, Security Scanning
  # =========================================================================
  edge-agent-ci:
    name: Edge Agent (Python 3.11 + YOLOv8 + OpenCV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edge-agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for OpenCV & WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libwebp-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check . --exit-zero

      - name: Run Pytest & Benchmark Accuracy Suite
        run: |
          pytest -v test_edge.py --junitxml=junit.xml

      - name: Verify Evaluator CLI Benchmark
        run: |
          python evaluator.py

  # =========================================================================
  # 2. Frontend Dashboard Verification: TypeScript, Linting, Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend SMU Dashboard (Next.js 14 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Run Strict TypeScript Compilation Check
        run: |
          npm run type-check

      - name: Build Next.js Production Bundle
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # =========================================================================
  # 3. Docker Multi-Stage Buildx Verification & Container Layer Caching
  # =========================================================================
  docker-build:
    name: Docker Buildx Verification
    needs: [edge-agent-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Edge Agent Container
        uses: docker/build-push-action@v5
        with:
          context: ./edge-agent
          file: ./edge-agent/Dockerfile
          push: false
          tags: kaushal-edge-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Next.js Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: kaushal-smu-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
